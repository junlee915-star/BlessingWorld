name: Deploy to GitHub Pages

# main에 push될 때마다 GitHub Pages(project site: /BlessingWorld/)로 배포합니다.
# §14 개선안 §14.6 — 경로 라우팅(BrowserRouter)으로 빌드합니다(§App.tsx). GitHub Pages는
# 정적 호스팅이라 딥링크를 index.html로 서버에서 리라이트해줄 수 없으므로, 빌드 산출물의
# index.html을 404.html로도 복사해둡니다 — GitHub Pages가 존재하지 않는 경로 요청을 받으면
# 404.html을 돌려주는 동작을 이용해, 그 안에서 React Router가 다시 딥링크를 정상적으로
# 그려내게 합니다. Supabase 연결 정보는 이 저장소의 Actions secrets(VITE_SUPABASE_URL /
# VITE_SUPABASE_ANON_KEY)에서 옵니다 — 비어 있어도 빌드는 되고, 그 기능만 조용히
# 비활성화됩니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /BlessingWorld/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # GitHub Pages SPA 폴백 — 딥링크로 곧장 들어와도 404 대신 index.html이 다시 실행되게 합니다.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
